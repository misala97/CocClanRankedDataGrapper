<!DOCTYPE html>
<html lang="de" data-theme="light"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>V1 D · search</title>
<link rel="stylesheet" href="../../../static/gym/figtree.css">
<link rel="stylesheet" href="../../../static/gym/gym.css">
<style>
html, body { margin: 0; }
body { background: var(--ground); min-block-size: 100vh; overflow: hidden; }
.v1-shade { position: fixed; inset: 0; background: rgba(0, 0, 0, .5); }
.v1-sheet { position: fixed; inset: 40px 0 0; margin: 0 auto; block-size: auto;
  max-block-size: none; overflow-y: auto; display: block; opacity: 1; transform: none; }
.v1-sheet.v1-kb { inset-block-end: 291px; }
.v1-back { margin-inline-start: calc(var(--sp-2) * -1); }
.v1-search { position: relative; }
.v1-search .icon { position: absolute; inset-inline-start: 14px; inset-block-start: 50%;
  translate: 0 -50%; color: var(--unlit); pointer-events: none; }
.v1-search .input { inline-size: 100%; padding-inline-start: 40px; }
.v1-focus .input { outline: 2px solid var(--ink); outline-offset: 2px; }
.v1-intro { margin: var(--sp-3) 0 0; font-size: var(--t-sm); line-height: 1.45; color: var(--dim); text-wrap: pretty; }
.v1-group { margin-block-start: var(--sp-3); }
.v1-ghead__n { font-size: var(--t-meta); color: var(--unlit); }
.v1-in { margin-inline-start: 6px; font-size: var(--t-micro); font-weight: var(--w-bold);
  letter-spacing: var(--track-label); text-transform: uppercase; color: var(--done-ink); }

/* A -- the register */
.a-jump { display: flex; gap: var(--sp-2); overflow-x: auto; scrollbar-width: none;
  margin: var(--sp-3) calc(var(--sp-4) * -1) 0; padding-inline: var(--sp-4); }
.a-jump__b { flex: none; min-block-size: var(--tap); padding-inline: 14px; border-radius: var(--r-chip);
  font-size: var(--t-meta); font-weight: var(--w-semi); color: var(--dim);
  box-shadow: inset 0 0 0 1px var(--edge); }
.a-jump__b.is-on { background: var(--raised); box-shadow: none; color: var(--ink); }
.a-move { padding-block: var(--sp-3); }
.a-move + .a-move { border-block-start: 1px solid var(--edge); }
.a-move__head { display: flex; align-items: baseline; gap: var(--sp-2); }
.a-move__name { font-size: var(--t-body); font-weight: var(--w-semi); }
.a-move__n { font-size: var(--t-meta); color: var(--unlit); }
.a-vars { display: flex; flex-wrap: wrap; gap: var(--sp-2); margin-block-start: var(--sp-2); }
.a-var { display: inline-flex; align-items: center; gap: 6px; min-block-size: var(--tap);
  padding-inline: 14px; border-radius: var(--r-control); font-size: var(--t-sm);
  font-weight: var(--w-semi); color: var(--dim); box-shadow: inset 0 0 0 1px var(--edge-hi); }
.a-var--mine { background: var(--raised); box-shadow: none; color: var(--ink); }
.a-var__n { font-size: var(--t-meta); font-weight: var(--w-med); color: var(--dim);
  font-variant-numeric: tabular-nums; }
.a-var--more { box-shadow: none; padding-inline: var(--sp-2); color: var(--dim); }

/* B -- two steps */
.b-row { gap: var(--sp-3); }
.b-meta { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.b-trail { flex: none; display: inline-flex; align-items: center; gap: 4px; color: var(--unlit); }
.b-trail__n { font-size: var(--t-meta); font-weight: var(--w-semi); font-variant-numeric: tabular-nums; }
.b-trail--add { inline-size: 32px; block-size: 32px; justify-content: center;
  border-radius: 50%; box-shadow: inset 0 0 0 1px var(--edge-hi); color: var(--dim); }
.b-most { margin-inline-start: var(--sp-2); vertical-align: 2px; }

/* C -- yours first */
.c-cluster { padding-block: var(--sp-1); }
.c-cluster + .c-cluster { border-block-start: 1px solid var(--edge-hi); margin-block-start: var(--sp-1); }
.c-row + .c-row { border-block-start: 1px solid var(--edge); }
.c-row { min-block-size: 52px; }
.c-row--other .sheet-row__name { font-weight: var(--w-med); color: var(--dim); }
.c-n { flex: none; font-size: var(--t-body); font-weight: var(--w-bold); color: var(--ink);
  font-variant-numeric: tabular-nums; }
.c-move { padding-block: var(--sp-3) var(--sp-1); font-size: var(--t-meta); font-weight: var(--w-semi); color: var(--dim); }
.c-more { display: flex; align-items: center; min-block-size: var(--tap); font-size: var(--t-meta);
  font-weight: var(--w-semi); color: var(--dim); }
.c-empty { margin-block-end: var(--sp-2); }

/* D -- yours first, then every movement; muscle heads stay put under the title bar */
.d-group > .sheet__group-head { position: sticky; inset-block-start: 72px; z-index: 1;
  background: var(--chassis); }
/* one movement's variants read as one block: no line inside it, a full-bleed line between */
.d-cluster { margin-inline: calc(var(--sp-4) * -1); padding: var(--sp-1) var(--sp-4); }
.d-cluster + .d-cluster { margin-block-start: 0; }
.d-cluster .sheet-row + .sheet-row { border-block-start: 0; }
.v1-search + .d-cluster { margin-block-start: var(--sp-2); }
.d-all { display: flex; align-items: baseline; gap: var(--sp-2);
  margin: var(--sp-6) 0 0; padding-block-start: var(--sp-5); border-block-start: 1px solid var(--edge-hi);
  font-family: var(--font-display); font-size: var(--t-body); font-weight: var(--w-bold);
  letter-spacing: var(--track-name); }
.d-all span { font-size: var(--t-meta); font-weight: var(--w-med); letter-spacing: 0; color: var(--unlit); }

/* a phone keyboard, for the frames that search: it is what the lifter sees */
.kb { position: fixed; inset: auto 0 0; block-size: 291px; box-sizing: border-box;
  padding: 10px 3px 38px; background: #CFD3DA; display: flex; flex-direction: column; gap: 11px;
  font-family: system-ui, sans-serif; }
.kb__row { display: flex; justify-content: center; gap: 6px; }
.kb__k { flex: 0 0 30px; block-size: 42px; display: grid; place-items: center; border-radius: 5px;
  background: #FFF; color: #111; font-size: 21px; box-shadow: 0 1px 0 #8E929A; }
.kb__k--wide { flex: 1 1 auto; font-size: 15px; max-inline-size: 190px; background: #ABB0BA; }
</style></head>

tton></div><div class="c-cluster d-cluster"><button type="button" class="sheet-row c-row"><span class="sheet-row__main"><span class="sheet-row__name">Scottcurls (Maschine)</span><span class="sheet-row__meta">zuletzt gestern</span></span><span class="c-n">12×</span></button><button type="button" class="sheet-row c-row"><span class="sheet-row__main"><span class="sheet-row__name">Scottcurls (Maschine, Scheiben)</span><span class="sheet-row__meta">zuletzt vor 5 Wochen</span></span><span class="c-n">9×</span></button><button type="button" class="sheet-row c-row c-row--other"><span class="sheet-row__main"><span class="sheet-row__name">Scottcurls (SZ-Stange)</span></span></button><button type="button" class="sheet-row c-row c-row--other"><span class="sheet-row__main"><span class="sheet-row__name">Scottcurls (Kurzhantel)</span></span></button></div><div class="c-cluster d-cluster"><button type="button" class="sheet-row c-row c-row--other"><span class="sheet-row__main"><span class="sheet-row__name">Konzentrationscurls (Kurzhantel)</span></span></button></div><div class="c-cluster d-cluster"><button type="button" class="sheet-row c-row c-row--other"><span class="sheet-row__main"><span class="sheet-row__name">Schrägbankcurls (Kurzhantel)</span></span></button></div><div class="c-cluster d-cluster"><button type="button" class="sheet-row c-row c-row--other"><span class="sheet-row__main"><span class="sheet-row__name">Bayesian Curls (Kabel)</span></span></button></div><div class="c-cluster d-cluster"><button type="button" class="sheet-row c-row c-row--other"><span class="sheet-row__main"><span class="sheet-row__name">Beinbeuger (Maschine, sitzend)</span></span></button><button type="button" class="sheet-row c-row c-row--other"><span class="sheet-row__main"><span class="sheet-row__name">Beinbeuger (Maschine, liegend)</span></span></button><button type="button" class="sheet-row c-row c-row--other"><span class="sheet-row__main"><span class="sheet-row__name">Beinbeuger (Maschine, stehend)</span></span></button></div><div class="c-cluster d-cluster"><button type="button" class="sheet-row c-row c-row--other"><span class="sheet-row__main"><span class="sheet-row__name">Handgelenkcurls (Langhantel)</span></span></button><button type="button" class="sheet-row c-row c-row--other"><span class="sheet-row__main"><span class="sheet-row__name">Handgelenkcurls (Kurzhantel)</span></span></button></div><div class="c-cluster d-cluster"><button type="button" class="sheet-row c-row c-row--other"><span class="sheet-row__main"><span class="sheet-row__name">Reverse Curls (SZ-Stange)</span></span></button></div></div></dialog><div class="kb" aria-hidden="true"><div class="kb__row"><span class="kb__k">q</span><span class="kb__k">w</span><span class="kb__k">e</span><span class="kb__k">r</span><span class="kb__k">t</span><span class="kb__k">z</span><span class="kb__k">u</span><span class="kb__k">i</span><span class="kb__k">o</span><span class="kb__k">p</span><span class="kb__k">ü</span></div><div class="kb__row"><span class="kb__k">a</span><span class="kb__k">s</span><span class="kb__k">d</span><span class="kb__k">f</span><span class="kb__k">g</span><span class="kb__k">h</span><span class="kb__k">j</span><span class="kb__k">k</span><span class="kb__k">l</span><span class="kb__k">ö</span><span class="kb__k">ä</span></div><div class="kb__row"><span class="kb__k">⇧</span><span class="kb__k">y</span><span class="kb__k">x</span><span class="kb__k">c</span><span class="kb__k">v</span><span class="kb__k">b</span><span class="kb__k">n</span><span class="kb__k">m</span><span class="kb__k">⌫</span></div><div class="kb__row"><span class="kb__k kb__k--wide">123</span><span class="kb__k kb__k--wide">Leerzeichen</span><span class="kb__k kb__k--wide">Suchen</span></div></div></body></html>
