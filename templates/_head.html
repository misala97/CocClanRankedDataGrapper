<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ page_title }}</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>{{ favicon_icon | default('⚔️') }}</text></svg>">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@500;600;700&family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet">
    {% if chartjs %}<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>{% endif %}
    {% if chartjs_adapter %}<script src="https://cdn.jsdelivr.net/npm/chartjs-adapter-date-fns@3.0.0/dist/chartjs-adapter-date-fns.bundle.min.js"></script>{% endif %}
    <style>
        :root {
            --bg:      #0d1117;
            --surface: #161b22;
            --surf2:   #1c2330;
            --border:  #30363d;
            --bord2:   #21262d;
            --text:    #e6edf3;
            --muted:   #8b949e;
            --accent:  #f0a500;
            --acc2:    #e8863a;
            --green:   #3fb950;
            --blue:    #58a6ff;
            --red:     #f85149;
            --yellow:  #e3b341;
            --purple:  #bc8cff;
            --orange:  #d29922;
        }

        html { overflow-y: scroll; }

        /* ── PAGE HEADER ── */
        .page-header {
            position: sticky;
            top: 59px;
            z-index: 99;
            background: var(--bg);
            padding: 15px 0;
            border-bottom: 1px solid rgba(240,165,0,.15);
        }
        .page-header-controls { padding: 0; }
        .page-header-controls .controls { max-width: 1400px; margin: 0 auto; padding: 0 32px; }
        .page-header::before {
            content: ''; position: absolute; inset: 0;
            background: radial-gradient(ellipse 45% 150% at 5% 50%, rgba(240,165,0,.09), transparent 65%);
            pointer-events: none;
        }
        .page-header-inner {
            max-width: 1400px; margin: 0 auto;
            padding: 0 32px;
            display: flex; align-items: flex-start; justify-content: space-between;
            gap: 20px; flex-wrap: wrap; position: relative; z-index: 1;
        }
        .page-header h1 {
            font-family: 'Rajdhani', sans-serif; font-size: 52px; font-weight: 700;
            letter-spacing: 3px; line-height: 1; text-transform: uppercase;
            margin-bottom: 10px; position: relative; padding-left: 20px;
        }
        .page-header h1::before {
            content: ''; position: absolute; left: 0; top: 0.08em; bottom: 0.08em;
            width: 4px; background: linear-gradient(180deg, #f0a500, #e8863a);
            border-radius: 2px; box-shadow: 0 0 16px rgba(240,165,0,.55);
        }
        .page-header h1 span {
            background: linear-gradient(135deg, #f0a500 0%, #ffd060 50%, #e8863a 100%);
            -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text;
        }
        .page-header p, .page-sub { color: var(--muted); font-size: 14px; padding-left: 20px; margin-top: 6px; }
        .page-controls { padding: 0 32px 16px; position: sticky; top: 58px; z-index: 99; background: var(--bg); }
        .page-controls .controls { max-width: 1400px; margin: 0 auto; margin-bottom: 0; position: static; }

        /* ── CONTROLS BAR ── */
        .controls {
            display: flex; align-items: center; gap: 10px; flex-wrap: wrap;
            background: var(--surface); padding: 12px 18px;
            border-radius: 10px; border: 1px solid var(--border); margin-bottom: 0;
        }
        .controls label { font-size: 11px; font-weight: 700; color: var(--muted); text-transform: uppercase; letter-spacing: 0.8px; white-space: nowrap; }
        .ctrl-divider { width: 1px; height: 22px; background: var(--border); flex-shrink: 0; }
        .selector {
            padding: 7px 13px; border: 1px solid var(--border); border-radius: 7px;
            font-size: 13px; font-family: 'DM Sans', sans-serif;
            background: var(--surf2); color: var(--text);
            cursor: pointer; transition: border-color 0.15s, box-shadow 0.15s;
            appearance: none; -webkit-appearance: none;
        }
        .selector:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px rgba(240,165,0,0.12); }
        .action-btn {
            padding: 7px 14px; background: transparent; color: var(--accent);
            border: 1px solid rgba(240,165,0,0.35); border-radius: 6px;
            font-weight: 700; font-size: 13px; font-family: 'Rajdhani', sans-serif;
            letter-spacing: 0.5px; text-transform: uppercase; cursor: pointer; transition: all 0.15s; white-space: nowrap;
        }
        .action-btn:hover { background: rgba(240,165,0,0.1); border-color: var(--accent); box-shadow: 0 0 12px rgba(240,165,0,0.18); }
        .action-btn.active { background: rgba(240,165,0,0.12); border-color: var(--accent); color: var(--accent); }
        @media (max-width: 900px) {
            .page-header { padding: 15px 0; }
            .page-header-inner { padding: 0 20px; }
            .page-header-controls .controls { padding: 0 20px; }
            .page-header h1 { font-size: 36px; letter-spacing: 1.5px; }
            .page-controls { padding: 0 20px 12px; }
        }
