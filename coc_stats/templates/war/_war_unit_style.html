{#- ═══════════════════════════════════════════════════════════════════════
   SHARED War Detail unit styles (M1 scoreboard · M2 win projection · M3
   roster ledger + map · M4 verdict table · M5 matchup · M6 attack log).
   Included inside the page's already-open <style> (the _head.html convention).
   Consumed by BOTH /war (clanwar.html) and /cwl (cwl.html) so the unit can
   never drift between the two pages. Mode hue is parameterized:
     var(--unit-mode, var(--ops-war))  →  War Amber by default (/war),
     /cwl sets --unit-mode: var(--purple) on the unit wrapper (CWL Violet).
   ═══════════════════════════════════════════════════════════════════════ -#}
        /* ── ROSTER ── */
        .roster-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 120px; }
        @media (max-width: 900px) { .roster-grid { grid-template-columns: 1fr; } }

        .roster-card { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; overflow: hidden; }
        .roster-card-header {
            background: var(--surf2); padding: 11px 18px;
            display: flex; justify-content: space-between; align-items: center; gap: 8px; flex-wrap: wrap;
            border-bottom: 1px solid var(--border);
        }
        .rh-left  { font-family: 'Rajdhani', sans-serif; font-size: 13px; font-weight: 700; letter-spacing: .5px; text-transform: uppercase; color: var(--text); }
        .rh-right { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
        .rh-meta  { font-size: 11px; color: var(--muted); }

        /* ── MEMBER ROW ── */
        .member-row {
            padding: 10px 18px; border-bottom: 1px solid var(--bord2);
            display: grid; grid-template-columns: 26px 38px 1fr 72px auto;
            align-items: center; gap: 10px; transition: background .1s;
        }
        .member-row:last-child { border-bottom: none; }
        .member-row:hover { background: color-mix(in oklch, var(--text) 2%, transparent); }

        /* Map view's roster-card-header average-league badge (avg_league_our/opp) */
        .league-pill {
            display: inline-flex; align-items: center;
            padding: 2px 9px; border-radius: 4px; font-size: 12px; font-weight: 600;
            font-family: 'Rajdhani', sans-serif; letter-spacing: .2px;
        }
        .lp-gold { background: color-mix(in oklch, var(--unit-mode, var(--ops-war)) 10%, transparent); color: var(--unit-mode, var(--ops-war)); border: 1px solid color-mix(in oklch, var(--unit-mode, var(--ops-war)) 25%, transparent); }

        .map-pos { font-family: 'Rajdhani', sans-serif; font-weight: 700; color: var(--muted); font-size: 12px; text-align: center; }
        .th-badge {
            display: inline-flex; align-items: center; justify-content: center;
            padding: 2px 6px; border-radius: 5px; font-size: 11px; font-weight: 700;
            font-family: 'Rajdhani', sans-serif;
            background: color-mix(in oklch, var(--blue) 10%, transparent); color: var(--blue); border: 1px solid color-mix(in oklch, var(--blue) 20%, transparent);
        }

        .member-info {}
        .member-name { font-weight: 600; font-size: 14px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .player-link { color: inherit; text-decoration: none; transition: color 0.15s; }
        .player-link:hover { color: var(--accent); }
        .player-link-arrow { font-size: 10px; color: var(--muted); opacity: 0.4; transition: opacity 0.15s, color 0.15s; vertical-align: super; }
        .player-link:hover .player-link-arrow { opacity: 1; color: var(--accent); }
        .member-sub-row { display: flex; align-items: center; gap: 5px; flex-wrap: wrap; margin-top: 2px; }
        .member-sub  { font-size: 10px; color: var(--muted); font-family: 'Rajdhani', sans-serif; line-height: 1.4; white-space: nowrap; }

        .attacks-col { display: flex; flex-direction: column; align-items: flex-end; gap: 3px; min-width: 90px; }
        .attack-pill {
            display: inline-flex; align-items: center; gap: 4px;
            padding: 2px 7px; border-radius: 4px; font-size: 11px; font-weight: 600;
            font-family: 'Rajdhani', sans-serif; white-space: nowrap; letter-spacing: .2px;
        }
        .attack-3 { background: color-mix(in oklch, var(--green) 12%, transparent);  color: var(--green);  border: 1px solid color-mix(in oklch, var(--green) 25%, transparent); }
        .attack-2 { background: color-mix(in oklch, var(--yellow) 12%, transparent); color: var(--yellow); border: 1px solid color-mix(in oklch, var(--yellow) 25%, transparent); }
        .attack-1 { background: color-mix(in oklch, var(--unit-mode, var(--ops-war)) 10%, transparent); color: var(--unit-mode, var(--ops-war)); border: 1px solid color-mix(in oklch, var(--unit-mode, var(--ops-war)) 20%, transparent); }
        .attack-0 { background: color-mix(in oklch, var(--red) 10%, transparent);    color: var(--red);    border: 1px solid color-mix(in oklch, var(--red) 20%, transparent); }
        .attack-empty { color: var(--muted); font-size: 10px; font-family: 'Rajdhani', sans-serif; opacity: .45; }

        .atk-count {
            font-family: 'Rajdhani', sans-serif; font-weight: 700; font-size: 14px;
            text-align: right; white-space: nowrap;
        }
        .atk-full    { color: var(--green); }
        .atk-partial { color: var(--yellow); }
        .atk-none    { color: var(--muted); opacity: .4; }
        .atk-prep    { color: var(--muted); font-size: 11px; }

        .atk-pills { display: none; }

        /* ── DEFENSE COLUMN ── */
        .def-col {
            display: flex; flex-direction: row; align-items: center; justify-content: center; gap: 4px;
        }
        .def-stars  { font-size: 1.18em; letter-spacing: 1px; white-space: nowrap; }
        .def-filled { color: var(--yellow); }
        .def-empty  { color: var(--muted); opacity: .4; }
        .def-hits { font-size: 9px; color: var(--muted); font-family: 'Rajdhani', sans-serif; letter-spacing: .3px; }
        .def-safe { font-size: 11px; color: var(--green); font-family: 'Rajdhani', sans-serif; font-weight: 600; }

        /* ── COLUMN HEADERS ── */
        .roster-col-hdr {
            display: grid; grid-template-columns: 26px 38px 1fr 72px auto;
            padding: 5px 18px; gap: 10px;
            background: color-mix(in oklch, var(--text) 1.5%, transparent); border-bottom: 1px solid var(--border);
            font-size: 9px; text-transform: uppercase; letter-spacing: .8px; color: var(--muted);
        }
        .roster-col-hdr .rch-def  { text-align: center; }
        .roster-col-hdr .rch-atk  { text-align: right; }


        /* ── ROW SELECTION ── */
        .member-row { cursor: pointer; transition: background .1s, opacity .15s; }
        .member-row.row-me {
            background: color-mix(in oklch, var(--unit-mode, var(--ops-war)) 9%, transparent);
            outline: 1px solid color-mix(in oklch, var(--unit-mode, var(--ops-war)) 45%, transparent);
            outline-offset: -1px;
        }


        .cmp-sec { padding: 22px 28px; border-bottom: 1px solid var(--bord2); }
        .cmp-sec:last-child { border-bottom: none; }
        .cmp-title {
            font-family: 'Rajdhani', sans-serif; font-size: 11px; font-weight: 700;
            letter-spacing: 1.2px; text-transform: uppercase; color: var(--muted);
            margin-bottom: 18px; display: flex; align-items: center; gap: 8px;
        }
        .cmp-title::after { content:''; flex:1; height:1px; background:var(--bord2); }

        /* ── PREDICTION ── */
        .pred-split {
            display: grid; grid-template-columns: 1fr 1fr; height: 44px;
            border-radius: 8px; overflow: hidden; margin-bottom: 12px;
        }
        .pred-half-our {
            background: linear-gradient(90deg, color-mix(in oklch, var(--green) 35%, transparent) 0%, color-mix(in oklch, var(--green) 15%, transparent) 100%);
            display: flex; align-items: center; padding: 0 16px;
            border-right: 2px solid var(--surface);
        }
        .pred-half-opp {
            background: linear-gradient(270deg, color-mix(in oklch, var(--red) 35%, transparent) 0%, color-mix(in oklch, var(--red) 15%, transparent) 100%);
            display: flex; align-items: center; justify-content: flex-end; padding: 0 16px;
        }
        .pred-pct {
            font-family: 'Rajdhani', sans-serif; font-size: 22px; font-weight: 700;
        }
        .pred-pct-name { font-size: 12px; font-weight: 500; margin-left: 6px; opacity: .8; }
        .pred-half-our .pred-pct { color: var(--green); }
        .pred-half-opp .pred-pct { color: var(--red); }
        .pred-verdict { text-align: center; font-size: 13px; color: var(--muted); margin-bottom: 16px; }

        .pred-factors-grid {
            display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            gap: 8px;
        }
        .pred-factor-row {
            background: var(--surf2); border-radius: 8px; padding: 10px 14px;
            display: flex; flex-direction: column; gap: 4px; border: 1px solid var(--bord2);
        }
        .pfr-label { font-size: 10px; text-transform: uppercase; letter-spacing: .6px; color: var(--muted); }
        .pfr-vals  { display: flex; justify-content: space-between; align-items: baseline; }
        .pfr-our   { font-family: 'Rajdhani', sans-serif; font-size: 16px; font-weight: 700; }
        .pfr-sep   { font-size: 10px; color: var(--muted); }
        .pfr-opp   { font-family: 'Rajdhani', sans-serif; font-size: 16px; font-weight: 700; }
        .pfr-win-our .pfr-our { color: var(--green); }
        .pfr-win-opp .pfr-opp { color: var(--red); }
        .pfr-win-our .pfr-opp, .pfr-win-opp .pfr-our { color: var(--muted); opacity: .6; }

        /* ── STATS ── */
        .stat-cmp-row {
            display: grid; grid-template-columns: 1fr 140px 1fr;
            align-items: center; padding: 10px 0;
            border-bottom: 1px solid var(--bord2);
        }
        .stat-cmp-row:last-child { border-bottom: none; }
        .scr-our { text-align: right; font-family: 'Rajdhani', sans-serif; font-size: 20px; font-weight: 700; }
        .scr-opp { text-align: left;  font-family: 'Rajdhani', sans-serif; font-size: 20px; font-weight: 700; }
        .scr-label { text-align: center; font-size: 10px; text-transform: uppercase; letter-spacing: .6px; color: var(--muted); padding: 0 12px; }
        .scr-win  { color: var(--green); }
        .scr-lose { color: var(--muted); opacity: .5; }

        /* ── DISTRIBUTION (TH + League) ── */
        .dist-header { display: grid; grid-template-columns: 1fr 64px 1fr; margin-bottom: 10px; }
        .dist-our-lbl { font-size: 11px; font-weight: 600; color: var(--green); }
        .dist-opp-lbl { font-size: 11px; font-weight: 600; color: var(--red); text-align: right; }
        .dist-center  { text-align: center; }

        .dist-row { display: grid; grid-template-columns: 32px 1fr 64px 1fr 32px; gap: 6px; align-items: center; margin-bottom: 5px; }
        .dist-count-our { font-family: 'Rajdhani', sans-serif; font-weight: 700; font-size: 13px; color: var(--green); text-align: right; }
        .dist-count-opp { font-family: 'Rajdhani', sans-serif; font-weight: 700; font-size: 13px; color: var(--red); }
        .dist-bar-our { height: 8px; border-radius: 3px; background: var(--green); opacity: .65; margin-left: auto; }
        .dist-bar-opp { height: 8px; border-radius: 3px; background: var(--red);   opacity: .65; }
        .dist-lbl { font-family: 'Rajdhani', sans-serif; font-size: 11px; font-weight: 700; color: var(--muted); text-align: center; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

        /* ── LEAGUE PER PLAYER ── */
        .lg-summary { display: flex; gap: 20px; margin-bottom: 16px; }
        .lg-sum-item { display: flex; align-items: center; gap: 6px; font-size: 13px; }
        .lg-sum-dot  { width: 8px; height: 8px; border-radius: 50%; }

        .lg-table { width: 100%; border-collapse: collapse; font-size: 12px; table-layout: fixed; }
        .lg-table th { font-size: 10px; text-transform: uppercase; letter-spacing: .5px; color: var(--muted); padding: 4px 6px; border-bottom: 1px solid var(--bord2); }
        .lg-table td { padding: 6px 6px; border-bottom: 1px solid var(--bord2); }
        .lg-table tr:last-child td { border-bottom: none; }
        .lg-table .lgt-pos  { color: var(--muted); font-family: 'Rajdhani', sans-serif; font-weight: 700; text-align: center; width: 32px; }
        .lg-table .lgt-name { width: 120px; max-width: 120px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        .lg-table .lgt-lg   { width: 80px; max-width: 80px; font-family: 'Rajdhani', sans-serif; font-weight: 600; font-size: 11px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        .lg-table .lgt-diff { text-align: center; font-family: 'Rajdhani', sans-serif; font-weight: 700; width: 48px; }
        .lg-table th:nth-child(1), .lg-table td:nth-child(1) { width: 32px; }
        .lg-table th:nth-child(2), .lg-table td:nth-child(2) { width: 120px; }
        .lg-table th:nth-child(3), .lg-table td:nth-child(3) { width: 80px; }
        .lg-table th:nth-child(4), .lg-table td:nth-child(4) { width: 48px; }
        .lg-table th:nth-child(5), .lg-table td:nth-child(5) { width: 80px; }
        .lg-table th:nth-child(6), .lg-table td:nth-child(6) { width: 152px; }
        .lg-table thead th:nth-child(4) { text-align: center; }
        .lg-adv  { color: var(--green); background: color-mix(in oklch, var(--green) 5%, transparent); }
        .lg-dis  { color: var(--red);   background: color-mix(in oklch, var(--red) 5%, transparent); }
        .lg-even { color: var(--muted); }
        .no-data-lg { color: var(--muted); font-style: italic; }

        /* ── MATCHUP ── */
        .matchup-summary { display: flex; gap: 32px; justify-content: center; margin-bottom: 16px; }
        .matchup-stat { text-align: center; }
        .matchup-stat .mn { font-family: 'Rajdhani', sans-serif; font-size: 32px; font-weight: 700; }
        .matchup-stat .ml { font-size: 10px; color: var(--muted); text-transform: uppercase; letter-spacing: .5px; }
        .mn-green { color: var(--green); }
        .mn-red   { color: var(--red); }
        .mn-muted { color: var(--muted); }
        .matchup-table { width: 100%; border-collapse: collapse; font-size: 12px; }
        .matchup-table th { font-size: 10px; text-transform: uppercase; letter-spacing: .5px; color: var(--muted); padding: 4px 6px; border-bottom: 1px solid var(--bord2); }
        .matchup-table td { padding: 5px 6px; border-bottom: 1px solid var(--bord2); }
        .matchup-table tr:last-child td { border-bottom: none; }
        .matchup-table .mc { text-align: center; }
        .matchup-table .mr { text-align: right; }
        .mt-adv  { color: var(--green); font-weight: 700; }
        .mt-dis  { color: var(--red);   font-weight: 700; }
        .mt-even { color: var(--muted); }

        /* ── VERDICT DETAIL EXPAND ── */
        .vd-row { display: none; }
        .vd-row.expanded { display: table-row; }
        .vd-cell { padding: 0 !important; border: none !important; background: var(--bg); border-bottom: 1px solid var(--border) !important; }
        .vd-inner { padding: 16px; }
        .vd-section { background: var(--surface); border: 1px solid var(--border); border-radius: 8px; padding: 16px; }
        .vd-meta { display: flex; gap: 20px; flex-wrap: wrap; font-size: 12px; color: var(--muted); margin-bottom: 14px; }

        /* ── ATTACK CARDS ── */
        .atk-cards { display: flex; flex-direction: column; gap: 8px; }
        .atk-card {
            display: flex; align-items: stretch;
            background: var(--surf2); border: 1px solid var(--bord2); border-radius: 8px; overflow: hidden;
        }
        .atk-card-th {
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            gap: 4px; padding: 14px 16px; min-width: 150px;
            border-right: 1px solid var(--bord2);
            font-family: 'Rajdhani', sans-serif; font-weight: 700;
        }
        .atk-th-row { display: flex; align-items: center; gap: 6px; font-size: 14px; }
        .atk-th-you  { color: var(--text); }
        .atk-th-sep  { color: var(--muted); font-size: 12px; }
        .atk-th-them { color: var(--text); }
        .atk-th-diff { font-size: 11px; letter-spacing: .3px; font-family: 'Rajdhani', sans-serif; font-weight: 700; }
        .atk-th-divider { width: 100%; height: 1px; background: var(--bord2); margin: 4px 0; }
        .atk-card-target {
            flex: 1; padding: 14px 16px; border-right: 1px solid var(--bord2);
            display: flex; flex-direction: column; justify-content: center; gap: 4px;
        }
        .atk-target-name { font-weight: 600; font-size: 14px; line-height: 1.2; }
        .atk-target-meta { display: flex; align-items: center; gap: 8px; }
        .atk-target-pos   { font-size: 11px; color: var(--muted); font-family: 'Rajdhani', sans-serif; font-weight: 700; }
        .atk-target-state { margin-top: 5px; }
        .atk-state-dead    { font-size: 9px; font-weight: 700; font-family: 'Rajdhani', sans-serif; letter-spacing: .4px; text-transform: uppercase; color: var(--red); opacity: .8; }
        .atk-state-partial { font-size: 9px; font-weight: 700; font-family: 'Rajdhani', sans-serif; letter-spacing: .4px; text-transform: uppercase; color: var(--yellow); }
        .atk-state-fresh   { font-size: 9px; font-weight: 700; font-family: 'Rajdhani', sans-serif; letter-spacing: .4px; text-transform: uppercase; color: var(--muted); opacity: .55; }
        .atk-card-result {
            display: flex; align-items: center; justify-content: space-between;
            padding: 14px 18px; min-width: 180px; gap: 12px;
        }
        .atk-result-left { display: flex; align-items: center; gap: 8px; }
        .atk-result-pct { font-family: 'Rajdhani', sans-serif; font-weight: 700; font-size: 15px; color: var(--blue); }

        /* ── VERDICT TABLE ── */
        .vt-wrap { overflow-x: auto; -webkit-overflow-scrolling: touch; }
        .vt-table { width: 100%; border-collapse: collapse; font-size: 12.5px; }
        .vt-table thead th {
            padding: 11px 16px; text-align: left; font-weight: 600; color: var(--muted);
            font-size: 11px; text-transform: uppercase; letter-spacing: 0.8px; white-space: nowrap;
            border-bottom: 1px solid var(--border); background: var(--surf2);
        }
        .vt-table tbody tr { border-bottom: 1px solid var(--bord2); transition: background 0.12s; cursor: pointer; }
        .vt-table tbody tr:last-child { border-bottom: none; }
        .vt-table tbody tr:hover { background: color-mix(in oklch, var(--text) 3%, transparent); }
        .vt-table tbody td { padding: 12px 16px; vertical-align: middle; }
        .vt-sortable { cursor: pointer; user-select: none; transition: color .12s, background .12s; }
        .vt-sortable:hover { color: var(--text); }
        .vt-sortable:active { background: color-mix(in oklch, var(--unit-mode, var(--ops-war)) 8%, transparent); }
        .vt-sort-active { color: var(--accent) !important; }
        .vt-sort-active.asc::after  { content: ' ↑'; font-size: 0.85em; }
        .vt-sort-active.desc::after { content: ' ↓'; font-size: 0.85em; }

        /* page-specific override only: verdict-table "Details" buttons + header rate
           buttons need a minimum width for alignment; font/color/border come from the
           canonical .action-btn in _head.html now (this used to shadow it with a
           stale pre-rebrand amber/Rajdhani duplicate — deleted, not migrated). */
        .action-btn { min-width: 72px; }

        /* ── ATTACK PILLS ── */
        .atk-pill {
            display: inline-block; padding: 1px 6px; border-radius: 10px;
            font-size: 9px; font-weight: 700; font-family: 'Rajdhani', sans-serif;
            letter-spacing: 0.4px; text-transform: uppercase; border: 1px solid transparent;
        }
        .ap-clear           { background: color-mix(in oklch, var(--green) 12%, transparent);  color: var(--green);  border-color: color-mix(in oklch, var(--green) 30%, transparent); }
        .ap-failed-clear    { background: color-mix(in oklch, var(--yellow) 12%, transparent); color: var(--yellow); border-color: color-mix(in oklch, var(--yellow) 30%, transparent); }
        .ap-high-clear      { background: color-mix(in oklch, var(--purple) 12%, transparent); color: var(--purple); border-color: color-mix(in oklch, var(--purple) 30%, transparent); }
        .ap-farm            { background: color-mix(in oklch, var(--blue) 12%, transparent);   color: var(--blue);   border-color: color-mix(in oklch, var(--blue) 25%, transparent); }
        .ap-failed-farm     { background: color-mix(in oklch, var(--red) 12%, transparent);    color: var(--red);    border-color: color-mix(in oklch, var(--red) 30%, transparent); }
        .ap-low-clear       { background: color-mix(in oklch, var(--green) 7%, transparent);   color: var(--green);  border-color: color-mix(in oklch, var(--green) 20%, transparent); opacity:.85; }
        .ap-low-clear-fail  { background: color-mix(in oklch, var(--yellow) 8%, transparent);  color: var(--yellow); border-color: color-mix(in oklch, var(--yellow) 20%, transparent); opacity:.85; }
        .ap-clean-up        { background: color-mix(in oklch, var(--blue) 10%, transparent);   color: var(--blue);   border-color: color-mix(in oklch, var(--blue) 22%, transparent); }
        .ap-failed-clean-up { background: color-mix(in oklch, var(--red) 10%, transparent);    color: var(--red);    border-color: color-mix(in oklch, var(--red) 25%, transparent); }
        .ap-wasted          { background: color-mix(in oklch, var(--muted) 8%, transparent);   color: var(--muted);  border-color: color-mix(in oklch, var(--muted) 20%, transparent); opacity:.75; }
        .ap-no-attack       { background: color-mix(in oklch, var(--muted) 5%, transparent);   color: var(--muted);  border-color: color-mix(in oklch, var(--muted) 15%, transparent); opacity:.6; }

        /* ── FOOTER ── */
        .page-footer {
            text-align: center; padding: 18px; color: var(--muted); font-size: 12px;
            margin-top: 4px; border-top: 1px solid var(--bord2);
            font-family: 'Rajdhani', sans-serif; font-weight: 600; letter-spacing: 0.3px;
        }

        .no-war { text-align: center; padding: 80px 32px; color: var(--muted); }
        .no-war-icon { font-size: 48px; margin-bottom: 12px; }
        .no-war h2 { font-family: 'Rajdhani', sans-serif; font-size: 22px; font-weight: 700; color: var(--text); }

        /* ── WIN PROBABILITY ── */
        .wc-prob-bar { display: grid; height: 50px; border-radius: 8px; overflow: hidden; margin: 16px 20px 8px; }
        .wc-half-win  { background: linear-gradient(90deg, color-mix(in oklch, var(--green) 45%, transparent) 0%, color-mix(in oklch, var(--green) 20%, transparent) 100%); display: flex; align-items: center; padding: 0 16px; gap: 8px; min-width: 0; }
        .wc-half-draw { background: color-mix(in oklch, var(--muted) 15%, transparent); display: flex; align-items: center; justify-content: center; gap: 4px; min-width: 0; }
        .wc-half-loss { background: linear-gradient(270deg, color-mix(in oklch, var(--red) 45%, transparent) 0%, color-mix(in oklch, var(--red) 20%, transparent) 100%); display: flex; align-items: center; justify-content: flex-end; padding: 0 16px; gap: 8px; min-width: 0; }
        .wc-prob-pct  { font-family: 'Rajdhani', sans-serif; font-size: 20px; font-weight: 700; }
        .wc-half-win  .wc-prob-pct { color: var(--green); }
        .wc-half-draw .wc-prob-pct { color: var(--muted); font-size: 16px; }
        .wc-half-loss .wc-prob-pct { color: var(--red); }
        .wc-stats-row { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; padding: 4px 20px 16px; }
        .wc-stat-box  { background: var(--surf2); border: 1px solid var(--bord2); border-radius: 8px; padding: 10px 14px; text-align: center; }
        .wc-stat-val  { font-family: 'Rajdhani', sans-serif; font-size: 24px; font-weight: 700; line-height: 1.1; }
        .wc-stat-lbl  { font-size: 10px; color: var(--muted); text-transform: uppercase; letter-spacing: .6px; margin-top: 3px; }
        .wc-details   { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; padding: 0 20px 16px; }
        .wc-detail-box { background: var(--surf2); border: 1px solid var(--bord2); border-radius: 8px; padding: 12px 14px; }
        .wc-detail-title { font-size: 10px; font-weight: 700; text-transform: uppercase; letter-spacing: .8px; color: var(--muted); margin-bottom: 8px; font-family: 'Rajdhani', sans-serif; }
        .wc-detail-row { display: flex; justify-content: space-between; align-items: center; font-size: 12px; padding: 4px 0; border-bottom: 1px solid var(--bord2); }
        .wc-detail-row:last-child { border-bottom: none; }
        .wc-detail-key { color: var(--muted); }
        .wc-detail-val { font-family: 'Rajdhani', sans-serif; font-weight: 700; font-size: 13px; }
        .wc-guarantee  { padding: 4px 20px 12px; font-size: 12px; font-weight: 600; }
        @media (max-width: 900px) { .wc-details { grid-template-columns: 1fr; } }

        /* ── WAR FLAGS ── */
        .war-flag {
            display: inline-flex; align-items: center;
            padding: 1px 6px; border-radius: 4px; font-size: 9px; font-weight: 700;
            font-family: 'Rajdhani', sans-serif; letter-spacing: .5px; text-transform: uppercase;
            cursor: default; border: 1px solid transparent; line-height: 1.6;
        }
        .war-flag.flag-on  { background: color-mix(in oklch, var(--red) 12%, transparent); color: var(--red);   border-color: color-mix(in oklch, var(--red) 30%, transparent); }
        .war-flag.flag-off { background: var(--surf2);         color: var(--muted); border-color: var(--bord2); opacity: .45; }
        button.war-flag { cursor: pointer; transition: opacity .15s, border-color .15s, transform .1s; }
        button.war-flag:hover { opacity: 1 !important; }
        button.war-flag.flag-off:hover { border-color: var(--muted); color: var(--muted); }
        button.war-flag.flag-on:hover  { border-color: var(--red); }
        button.war-flag:active { transform: scale(0.94); transition-duration: .08s; }

        /* ── ATTACK LOG ── */
        .log-scroll { max-height: 420px; overflow-y: auto; scrollbar-width: thin; scrollbar-color: var(--border) transparent; }
        .log-scroll::-webkit-scrollbar { width: 4px; }
        .log-scroll::-webkit-scrollbar-track { background: transparent; }
        .log-scroll::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }
        .log-scroll::-webkit-scrollbar-thumb:hover { background: var(--muted); }
        .recent-card {
            background: var(--surface); border: 1px solid var(--border);
            border-radius: 10px; margin-bottom: 24px; overflow: hidden;
        }
        .recent-header {
            display: flex; align-items: center; justify-content: space-between;
            padding: 14px 20px; cursor: pointer; user-select: none; transition: background .15s, transform .1s;
        }
        /* header is a real <button> now (keyboard/SR operable) — reset button chrome */
        button.recent-header { width: 100%; background: none; border: none; font: inherit; color: inherit; text-align: left; }
        .recent-header:hover { background: var(--surf2); }
        .recent-header:active { background: color-mix(in oklch, var(--unit-mode, var(--ops-war)) 6%, var(--surf2)); transform: scale(0.997); transition-duration: .08s; }
        .recent-header-title {
            font-family: 'Rajdhani', sans-serif; font-size: 13px; font-weight: 700;
            color: var(--muted); text-transform: uppercase; letter-spacing: 1px;
        }
        .recent-chevron { font-size: 11px; color: var(--muted); transition: transform .2s; }
        .recent-chevron.open { transform: rotate(180deg); }
        .recent-body { border-top: 1px solid var(--border); display: none; }
        .table-scroll { overflow-x: auto; -webkit-overflow-scrolling: touch; }
        .detail-table { width: 100%; border-collapse: collapse; font-size: 12.5px; }
        .detail-table thead { background: var(--surf2); }
        .detail-table th {
            padding: 9px 14px; font-size: 10px; font-weight: 700; color: var(--muted);
            text-transform: uppercase; letter-spacing: .6px; font-family: 'Rajdhani', sans-serif;
            border-bottom: 1px solid var(--border); white-space: nowrap;
        }
        .detail-table td { padding: 9px 14px; border-bottom: 1px solid var(--bord2); color: var(--text); }
        .detail-table tbody tr:last-child td { border-bottom: none; }
        .detail-table tbody tr:hover { background: color-mix(in oklch, var(--text) 2.5%, transparent); }

        /* ═══════════════ DIRECTION B · TARGETING SCOPE ═══════════════ */
        /* Mode identity = War Amber (--ops-war). Win/loss = IFF green / raid red.
           Numbers = JetBrains Mono. Display = Big Shoulders. Scope reticle is the
           signature moment. */
        .w2-board {
            position: relative; border: 1px solid color-mix(in oklch, var(--unit-mode, var(--ops-war)) 34%, var(--border));
            border-radius: 14px; background:
              radial-gradient(120% 90% at 50% 42%, color-mix(in oklch, var(--unit-mode, var(--ops-war)) 8%, transparent), transparent 62%),
              var(--surface);
            padding: 26px 30px; margin-bottom: 22px; overflow: hidden;
        }
        .w2-brk { position: absolute; width: 15px; height: 15px; border: 2px solid var(--unit-mode, var(--ops-war)); opacity: .75; }
        .w2-brk.tl { top: 11px; left: 11px; border-right: 0; border-bottom: 0; }
        .w2-brk.tr { top: 11px; right: 11px; border-left: 0; border-bottom: 0; }
        .w2-brk.bl { bottom: 11px; left: 11px; border-right: 0; border-top: 0; }
        .w2-brk.br { bottom: 11px; right: 11px; border-left: 0; border-top: 0; }

        .w2-grid { display: grid; grid-template-columns: 1fr auto 1fr; gap: 24px; align-items: center; }

        .w2-clan { display: flex; flex-direction: column; gap: 12px; min-width: 0; }
        .w2-clan.right { text-align: right; align-items: flex-end; }
        .w2-ident { display: flex; align-items: center; gap: 13px; max-width: 100%; }
        .w2-clan.right .w2-ident { flex-direction: row-reverse; }
        .w2-badge { width: 52px; height: 52px; object-fit: contain; flex-shrink: 0; }
        .w2-badge-ph { width: 52px; height: 52px; border-radius: 10px; background: var(--surf2); border: 1px solid var(--border); display: grid; place-items: center; font-size: 22px; flex-shrink: 0; }
        .w2-name { font-family: 'Big Shoulders Display', sans-serif; font-weight: 800; font-size: clamp(18px, 2.4vw, 26px); line-height: 1; text-transform: uppercase; letter-spacing: .3px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 100%; }
        .w2-tag { font-family: 'JetBrains Mono', monospace; font-size: 11px; color: var(--muted); margin-top: 4px; }

        .w2-prof { display: flex; flex-direction: column; width: 100%; max-width: 236px; }
        .w2-clan.right .w2-prof { margin-left: auto; }
        .w2-pf { display: flex; align-items: center; justify-content: space-between; gap: 14px; padding: 5px 0; border-bottom: 1px solid var(--bord2); }
        .w2-pf:last-child { border-bottom: none; }
        .w2-clan.right .w2-pf { flex-direction: row-reverse; }
        .w2-pf .k { font-size: 9.5px; font-weight: 700; letter-spacing: .7px; text-transform: uppercase; color: var(--muted); white-space: nowrap; }
        .w2-pf .v { font-size: 12.5px; font-weight: 600; color: var(--text); text-align: right; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .w2-clan.right .w2-pf .v { text-align: left; }
        .w2-pf .v.cwl { color: var(--purple); }
        .w2-pf .v.hot { color: var(--unit-mode, var(--ops-war)); }
        .w2-pf .v.pub { color: var(--green); }

        .w2-score { font-family: 'JetBrains Mono', monospace; font-weight: 700; font-size: 30px; line-height: 1; display: flex; align-items: baseline; gap: 7px; }
        .w2-clan.right .w2-score { flex-direction: row-reverse; }
        .w2-score .st { color: var(--ops-star); font-size: 17px; }
        .w2-score .pct { font-family: 'JetBrains Mono', monospace; font-size: 12px; font-weight: 500; color: var(--muted); }
        .w2-atk { font-family: 'JetBrains Mono', monospace; font-size: 11.5px; color: var(--muted); }

        /* ── center reticle ── */
        .w2-center { display: flex; flex-direction: column; align-items: center; gap: 10px; padding: 0 8px; }
        .w2-reticle { position: relative; width: 132px; height: 132px; display: grid; place-items: center; }
        .w2-reticle svg { position: absolute; inset: 0; }
        .w2-gauge-arc { transition: stroke-dashoffset .9s cubic-bezier(.22,1,.36,1); }
        .w2-gv { font-family: 'JetBrains Mono', monospace; font-weight: 700; font-size: 28px; line-height: 1; }
        .w2-gl { font-size: 9px; letter-spacing: 1.2px; text-transform: uppercase; color: var(--muted); margin-top: 3px; text-align: center; }
        .w2-chip { font-family: 'Big Shoulders Display', sans-serif; font-weight: 800; text-transform: uppercase; letter-spacing: 1px; font-size: 15px; padding: 5px 16px; border-radius: 7px; text-align: center; }
        .w2-chip.win  { color: var(--green); background: color-mix(in oklch, var(--green) 13%, transparent); border: 1px solid color-mix(in oklch, var(--green) 36%, transparent); }
        .w2-chip.loss { color: var(--red);   background: color-mix(in oklch, var(--red) 13%, transparent);   border: 1px solid color-mix(in oklch, var(--red) 34%, transparent); }
        .w2-chip.tie  { color: var(--muted); background: color-mix(in oklch, var(--muted) 12%, transparent);  border: 1px solid color-mix(in oklch, var(--muted) 26%, transparent); }
        .w2-chip.prep { color: var(--unit-mode, var(--ops-war)); background: color-mix(in oklch, var(--unit-mode, var(--ops-war)) 12%, transparent); border: 1px solid color-mix(in oklch, var(--unit-mode, var(--ops-war)) 34%, transparent); }
        .w2-count { font-family: 'JetBrains Mono', monospace; font-size: 12.5px; color: var(--muted); text-align: center; }
        .w2-count b { color: var(--text); font-weight: 700; }
        .w2-size { font-family: 'JetBrains Mono', monospace; font-size: 11px; letter-spacing: 1px; color: var(--muted); padding-top: 8px; border-top: 1px solid var(--bord2); width: 100%; text-align: center; }
        .w2-live-dot { display: inline-block; width: 7px; height: 7px; border-radius: 50%; background: var(--green); box-shadow: 0 0 6px color-mix(in oklch, var(--green) 55%, transparent); margin-right: 5px; vertical-align: middle; animation: w2pulse 1.8s ease-in-out infinite; }
        @keyframes w2pulse { 0%,100%{opacity:1} 50%{opacity:.35} }

        @media (max-width: 760px) {
            .w2-board { padding: 20px 18px; }
            .w2-grid { grid-template-columns: 1fr; gap: 18px; }
            .w2-clan.right { text-align: left; align-items: flex-start; }
            .w2-clan.right .w2-ident { flex-direction: row; }
            .w2-clan.right .w2-prof { justify-content: flex-start; }
            .w2-clan.right .w2-score { flex-direction: row; }
            .w2-center { order: -1; }
        }
        @media (prefers-reduced-motion: reduce) {
            .w2-gauge-arc { transition: none; }
            .w2-live-dot { animation: none; }
            .w2-vtoggle button, .recent-header, .vt-sortable, #mapView .member-row, button.war-flag {
                transition: none !important;
            }
            .w2-vtoggle button:active, .recent-header:active, #mapView .member-row:active, button.war-flag:active {
                transform: none;
            }
        }

        /* ── M3 · roster ledger (default) + Map toggle ── */
        .w2-vtoggle { display: inline-flex; gap: 2px; background: var(--surf2); border: 1px solid var(--border); border-radius: 8px; padding: 3px; margin-bottom: 14px; }
        .w2-vtoggle button { font-family: 'JetBrains Mono', monospace; font-size: 11px; font-weight: 700; letter-spacing: .5px; text-transform: uppercase; padding: 6px 15px; border-radius: 6px; border: none; background: transparent; color: var(--muted); cursor: pointer; transition: background .15s, color .15s, transform .1s; }
        .w2-vtoggle button.active { background: color-mix(in oklch, var(--unit-mode, var(--ops-war)) 16%, transparent); color: var(--unit-mode, var(--ops-war)); }
        .w2-vtoggle button:hover:not(.active) { color: var(--text); }
        .w2-vtoggle button:active { transform: scale(0.95); transition-duration: .08s; }

        .w2-led { border: 1px solid var(--border); border-radius: 12px; overflow: hidden; }
        .w2-led-head, .w2-lrow { display: grid; grid-template-columns: 36px minmax(130px, 1fr) minmax(190px, 1.6fr) 118px; gap: 14px; align-items: center; padding: 11px 16px; }
        .w2-led-head { background: var(--surf2); border-bottom: 1px solid var(--border); font-size: 9.5px; font-weight: 700; letter-spacing: .8px; text-transform: uppercase; color: var(--muted); }
        .w2-lrow { border-bottom: 1px solid var(--bord2); }
        .w2-lrow:last-child { border-bottom: none; }
        .w2-lrow:hover { background: color-mix(in oklch, var(--text) 2.5%, transparent); }
        .w2-lpos { font-family: 'JetBrains Mono', monospace; font-weight: 700; color: var(--muted); text-align: center; font-size: 13px; }
        .w2-lwho { min-width: 0; }
        .w2-lwho .n { font-weight: 600; font-size: 13.5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .w2-lwho .th { font-family: 'JetBrains Mono', monospace; font-size: 11px; color: var(--muted); margin-top: 1px; }
        .w2-latk { display: flex; flex-direction: column; gap: 4px; font-size: 12px; min-width: 0; }
        .w2-latk .a { display: flex; align-items: center; gap: 8px; min-width: 0; }
        .w2-latk .st { color: var(--ops-star); font-family: 'JetBrains Mono', monospace; font-weight: 700; letter-spacing: 1px; flex-shrink: 0; }
        .w2-latk .pc { font-family: 'JetBrains Mono', monospace; color: oklch(0.80 0.012 330); font-size: 11px; flex-shrink: 0; }
        .w2-latk .tgt { color: oklch(0.80 0.012 330); font-size: 11.5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .w2-off-up { color: var(--unit-mode, var(--ops-war)); font-weight: 700; }
        .w2-off-dn { color: var(--ops-ink-dim); }
        .w2-latk .none { color: var(--muted); opacity: .5; }
        .w2-ldef { justify-self: end; text-align: right; font-size: 12px; display: flex; align-items: center; gap: 6px; }
        .w2-ldef .held { color: var(--green); font-family: 'JetBrains Mono', monospace; font-size: 11px; }
        .w2-ldef .hit { color: var(--ops-star); font-family: 'JetBrains Mono', monospace; font-weight: 700; letter-spacing: 1px; }
        .w2-ldef .hits { color: var(--muted); font-size: 10px; }
        @media (max-width: 640px) {
            .w2-led-head { display: none; }
            .w2-lrow { grid-template-columns: 30px 1fr auto; grid-template-areas: 'pos who def' 'atk atk atk'; gap: 5px 10px; row-gap: 8px; }
            .w2-lpos { grid-area: pos; } .w2-lwho { grid-area: who; } .w2-ldef { grid-area: def; } .w2-latk { grid-area: atk; }
            /* touch targets: 44px minimum on mobile (mouse-precision 24px is fine on
               desktop, matching the sitewide .controls .selector/.action-btn convention) */
            .w2-vtoggle button { padding: 13px 15px; min-height: 44px; box-sizing: border-box; }
            .vt-table thead th.vt-sortable { padding-top: 16px; padding-bottom: 16px; box-sizing: border-box; }
        }

        /* ── scope-language section + card headers (page-scoped: CWL's shared
              .recent-* classes are untouched) ── */
        .w2-sec-head { font-family: 'Big Shoulders Display', sans-serif; font-weight: 800; font-size: 16px; letter-spacing: .5px; text-transform: uppercase; color: var(--text); }
        .w2-sec-row { display: flex; align-items: center; gap: 16px; flex-wrap: wrap; margin-bottom: 14px; }
        .w2-sec-row .w2-vtoggle { margin-bottom: 0; }
        .container .recent-header-title { font-family: 'Big Shoulders Display', sans-serif; font-weight: 800; font-size: 15px; letter-spacing: .5px; color: var(--text); text-transform: uppercase; }
        /* WAI-ARIA APG disclosure pattern: the toggle button is wrapped in a heading
           so screen-reader users can navigate section-to-section by heading, not just
           by tabbing through every control. Purely semantic — resets to zero visual
           footprint of its own. */
        .recent-card > h2, .w2-sec-row > h2 { margin: 0; padding: 0; font: inherit; font-size: inherit; font-weight: inherit; line-height: inherit; }
        .container .recent-card { border-radius: 12px; }
        .container .recent-header { padding: 15px 20px; }

        /* ── M4 · state-adaptive module order. DOM order stays canonical
              (matchup, projection, verdicts, log, roster) for screen readers;
              `order` re-sequences the visual stack per war state (spec §4). ── */
        .war-spine { display: flex; flex-direction: column; }
        .war-spine > * { order: 9; }
        /* preparation → matchup leads, then roster (projection/verdicts/log absent) */
        .war-spine[data-state="preparation"] #matchupCard   { order: 1; }
        .war-spine[data-state="preparation"] #wcWrap-0      { order: 2; }
        .war-spine[data-state="preparation"] #rosterSection { order: 3; }
        /* inWar → projection · roster · verdicts · matchup(collapsed) · log */
        .war-spine[data-state="inWar"] #wcWrap-0      { order: 1; }
        .war-spine[data-state="inWar"] #rosterSection { order: 2; }
        .war-spine[data-state="inWar"] #warVerdictCard{ order: 3; }
        .war-spine[data-state="inWar"] #matchupCard   { order: 4; }
        .war-spine[data-state="inWar"] #logCard       { order: 5; }
        /* warEnded → verdicts · roster · projection · matchup(collapsed) · log */
        .war-spine[data-state="warEnded"] #warVerdictCard{ order: 1; }
        .war-spine[data-state="warEnded"] #rosterSection { order: 2; }
        .war-spine[data-state="warEnded"] #wcWrap-0      { order: 3; }
        .war-spine[data-state="warEnded"] #matchupCard   { order: 4; }
        .war-spine[data-state="warEnded"] #logCard       { order: 5; }

        /* ── M5 matchup → Targeting-Scope language. Page-scoped overrides on the
              shared buildCompareHTML markup; CWL's own copy stays untouched. ── */
        #matchupCard .cmp-sec { border-bottom-color: var(--bord2); }
        #matchupCard .cmp-title { font-family: 'Big Shoulders Display', sans-serif; font-weight: 800; font-size: 13px; letter-spacing: .8px; color: var(--text); }
        #matchupCard .cmp-title::after { background: var(--bord2); }
        /* flat scope fills instead of the old directional gradients */
        #matchupCard .pred-split { border: 1px solid var(--border); }
        #matchupCard .pred-half-our { background: color-mix(in oklch, var(--green) 15%, var(--surf2)); }
        #matchupCard .pred-half-opp { background: color-mix(in oklch, var(--red) 15%, var(--surf2)); }
        #matchupCard .pred-verdict { color: var(--ops-ink-dim); }
        /* boxed factors / stat cells → scope surface + border */
        #matchupCard .pred-factor-row, #matchupCard .wc-stat-box, #matchupCard .wc-detail-box { background: var(--surf2); border-color: var(--border); }
        /* numerals → JetBrains Mono, per the Numbers-Are-Mono rule */
        #matchupCard .pred-pct, #matchupCard .pfr-our, #matchupCard .pfr-opp,
        #matchupCard .scr-our, #matchupCard .scr-opp,
        #matchupCard .dist-count-our, #matchupCard .dist-count-opp,
        #matchupCard .matchup-stat .mn, #matchupCard .lgt-pos, #matchupCard .lgt-diff,
        #matchupCard .wc-stat-val, #matchupCard .wc-detail-val { font-family: 'JetBrains Mono', monospace; }
        /* labels stay in the humanist body face */
        #matchupCard .pfr-label, #matchupCard .scr-label, #matchupCard .matchup-stat .ml,
        #matchupCard .dist-our-lbl, #matchupCard .dist-opp-lbl, #matchupCard .cmp-title { text-transform: uppercase; }
        /* lift muted table body text for readability */
        #matchupCard .lg-table td, #matchupCard .matchup-table td { color: oklch(0.82 0.010 330); }
        #matchupCard .lg-even, #matchupCard .mt-even { color: var(--muted); }
        #matchupCard .lg-table th, #matchupCard .matchup-table th { color: var(--muted); }

        /* ── M3 map view → scope language + self-contained highlight/line engine
              (replaces the buggy shared roster line-drawer) ── */
        #mapView .roster-grid { gap: 68px; }
        #mapView .roster-card { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; }
        #mapView .roster-card-header { background: var(--surf2); border-bottom: 1px solid var(--border); }
        #mapView .rh-left { font-family: 'Big Shoulders Display', sans-serif; font-weight: 800; font-size: 14px; letter-spacing: .5px; color: var(--text); }
        #mapView .map-pos { font-family: 'JetBrains Mono', monospace; }
        #mapView .th-badge { font-family: 'JetBrains Mono', monospace; background: var(--surf2); color: oklch(0.80 0.012 330); border: 1px solid var(--border); }
        #mapView .member-row { cursor: pointer; transition: opacity .12s, background .12s, box-shadow .12s, transform .1s; }
        #mapView .member-row:active { transform: scale(0.995); transition-duration: .08s; }
        #mapView .member-row.w2m-sel { background: color-mix(in oklch, var(--unit-mode, var(--ops-war)) 13%, transparent); box-shadow: inset 0 0 0 1px color-mix(in oklch, var(--unit-mode, var(--ops-war)) 48%, transparent); }
        #mapView .member-row.w2m-t3 { background: color-mix(in oklch, var(--green) 13%, transparent); }
        #mapView .member-row.w2m-t2 { background: color-mix(in oklch, var(--yellow) 13%, transparent); }
        #mapView .member-row.w2m-t1 { background: color-mix(in oklch, var(--unit-mode, var(--ops-war)) 11%, transparent); }
        #mapView .member-row.w2m-t0 { background: color-mix(in oklch, var(--muted) 12%, transparent); }
        #mapView .member-row.w2m-in { box-shadow: inset 0 0 0 1px color-mix(in oklch, var(--blue) 40%, transparent); }
        #mapView .member-row.w2m-sug { background: color-mix(in oklch, var(--unit-mode, var(--ops-war)) 8%, transparent); box-shadow: inset 0 0 0 1px color-mix(in oklch, var(--unit-mode, var(--ops-war)) 40%, transparent); }
        #mapView .member-row.w2m-dim { opacity: .2; }
        #mapView #warConnections-0 line { stroke-linecap: round; }
        #mapView .w2m-hint { font-size: 11px; color: var(--muted); font-family: 'JetBrains Mono', monospace; padding: 0 2px 12px; }

        /* ── reference rate modals → Targeting-Scope telemetry readout (war page only;
              restyles the shared render output without touching war_shared.js / CWL) ── */
        #mrModal, #pmrModal { border-radius: 12px; }
        #mrModal > div:first-child, #pmrModal > div:first-child { background: var(--surf2) !important; border-bottom: 1px solid var(--border) !important; }
        #mrContent [style*="Rajdhani"], #pmrContent [style*="Rajdhani"] { font-family: 'JetBrains Mono', monospace !important; letter-spacing: 0 !important; }
        #mrContent table, #pmrContent table { width: 100%; border-collapse: collapse; margin-top: 4px; }
        #mrContent thead th, #pmrContent thead th { background: var(--surf2) !important; font-family: 'Manrope', sans-serif !important; font-size: 9px !important; font-weight: 700 !important; text-transform: uppercase; letter-spacing: .8px !important; color: var(--muted) !important; padding: 8px 14px !important; border-bottom: 1px solid var(--border) !important; }
        #mrContent tbody td, #pmrContent tbody td { padding: 9px 14px !important; border-bottom: 1px solid var(--bord2) !important; }
        #mrContent tbody tr:hover, #pmrContent tbody tr:hover { background: color-mix(in oklch, var(--text) 3.5%, transparent); }
        /* group band header ("THxx Attacking") → scope band label */
        #mrContent > div > div:first-child { font-family: 'Big Shoulders Display', sans-serif !important; font-weight: 800 !important; font-size: 13px !important; letter-spacing: .6px !important; color: var(--text) !important; text-transform: uppercase; padding-bottom: 8px !important; }
        #mrContent > div:first-child { font-family: 'Manrope', sans-serif !important; color: var(--muted); }

        /* ── motion: state-conveying reveals (expand + modal entrance). Collapse is
              instant (exit faster than enter); reduced-motion drops them all. ── */
        @keyframes w2-reveal   { from { opacity: 0; transform: translateY(-5px); } to { opacity: 1; transform: none; } }
        @keyframes w2-modal-in { from { opacity: 0; transform: translate(-50%, -50%) scale(.985); } to { opacity: 1; transform: translate(-50%, -50%) scale(1); } }
        @keyframes w2-fade     { from { opacity: 0; } to { opacity: 1; } }
        .container .recent-body { animation: w2-reveal .26s cubic-bezier(.22, 1, .36, 1); }
        #ledgerView, #mapView { animation: w2-fade .2s ease-out; }
        #mrModal, #pmrModal { animation: w2-modal-in .2s cubic-bezier(.22, 1, .36, 1); }
        #mrBackdrop, #pmrBackdrop { animation: w2-fade .2s ease-out; }
        @media (prefers-reduced-motion: reduce) {
            .container .recent-body, #ledgerView, #mapView,
            #mrModal, #pmrModal, #mrBackdrop, #pmrBackdrop { animation: none !important; }
        }
